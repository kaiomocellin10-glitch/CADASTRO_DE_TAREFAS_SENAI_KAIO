<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel de Tarefas</title>
    
    <!-- Ícones Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilos customizados -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="cartao-aplicacao">
        <header class="cabecalho-aplicacao">
            <h1>Minhas Tarefas</h1>
            <button id="botao-tema" class="botao-secundario" aria-label="Alternar modo escuro">
                <i class="fa-solid fa-moon"></i>
            </button>
        </header>

        <section class="caixa-entrada">
            <input 
                type="text" 
                id="campo-tarefa" 
                placeholder="O que vamos fazer hoje?"
                aria-label="Descrição da nova tarefa"
                autocomplete="off"
            >
            <button id="botao-adicionar" class="botao-principal">
                <i class="fa-solid fa-plus"></i>
                <span>Adicionar</span>
            </button>
        </section>

        <ul id="lista-tarefas" class="lista-tarefas" aria-live="polite">
            <!-- As tarefas serão inseridas aqui dinamicamente via JS -->
        </ul>

        <footer class="rodape-aplicacao">
            <span id="contador-tarefas">0 tarefas na lista</span>
        </footer>
    </main>

    <!-- Scripts JavaScript -->
    <script src="script.js"></script>
</body>
</html>
